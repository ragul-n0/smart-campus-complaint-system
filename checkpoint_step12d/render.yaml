services:
  - type: web
    name: smart-campus-complaint-system
    env: python
    region: oregon
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        value: "sqlite:///./campus_complaints.db"
      - key: FRONTEND_DIST_DIR
        value: "../frontend/dist"
      - key: ML_MODELS_DIR
        value: "../ml/models"
